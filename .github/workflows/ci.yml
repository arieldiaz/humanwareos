name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Node contracts
        run: node --test $(find . -name '*.test.mjs' -o -name '*.test.js' | sort)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python schema test dependency
        run: python3 -m pip install jsonschema==4.23.0
      - name: Python contracts
        run: |
          PYTHONPATH=ops/menubar python3 -m unittest discover -s ops/menubar
          python3 -m unittest discover -s ops/session-console/tests
      - name: macOS surface
        run: swift build --package-path surfaces/macos/HumanwareOS
      - name: Shell contracts
        run: |
          set -euo pipefail
          for test_script in tests/*.sh; do
            bash "$test_script"
          done
      - name: Validate JSON
        run: |
          set -euo pipefail
          for json_file in schemas/*.json templates/data/manifests/*.json templates/instance/runtime/*.json; do
            jq -e . "$json_file" >/dev/null
          done
