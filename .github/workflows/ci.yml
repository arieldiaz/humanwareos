name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Service dependencies
        run: |
          npm --prefix services/email-intake ci --ignore-scripts
          npm --prefix services/agent-email ci --ignore-scripts
      - name: Node contracts
        run: node --test $(find . -path '*/node_modules' -prune -o \( -name '*.test.mjs' -o -name '*.test.js' \) -print | sort)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python schema test dependency
        run: python3 -m pip install jsonschema==4.23.0
      - name: Python contracts
        run: |
          PYTHONPATH=ops/menubar python3 -m unittest discover -s ops/menubar
          python3 -m unittest discover -s ops/session-console/tests
          python3 -m unittest discover -s ops/artifacts
          python3 -m unittest discover -s services/share-auth -p "test_*.py"
          python3 -m unittest discover -s services/ingest/server -p "test_*.py"
          python3 services/observability/token-tracking/test_build_dashboard.py
          python3 services/observability/net-monitor/test_net_monitor.py
          python3 services/observability/heartbeat/test_heartbeat.py
      - name: macOS surface
        run: swift build --package-path surfaces/macos/HumanwareOS
      - name: Shell contracts
        run: |
          set -euo pipefail
          for test_script in tests/*.sh; do
            bash "$test_script"
          done
      - name: Validate JSON
        run: |
          set -euo pipefail
          for json_file in schemas/*.json runtime/*.json templates/data/manifests/*.json templates/instance/runtime/*.json; do
            jq -e . "$json_file" >/dev/null
          done
