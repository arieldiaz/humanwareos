name: Buzz community image

on:
  workflow_dispatch:
    inputs:
      buzz_ref:
        description: Commit or branch in arieldiaz/buzz to build
        required: true
        default: fb5c6ac
  push:
    branches:
      - feat/buzz-cloudflare-alpha
    paths:
      - .github/workflows/buzz-community-image.yml

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve Buzz ref
        id: ref
        env:
          INPUT_REF: ${{ inputs.buzz_ref }}
        run: echo "value=${INPUT_REF:-fb5c6ac}" >> "$GITHUB_OUTPUT"

      - name: Check out patched Buzz fork
        uses: actions/checkout@v4
        with:
          repository: arieldiaz/buzz
          ref: ${{ steps.ref.outputs.value }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish relay image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/humanwareos-buzz:${{ steps.ref.outputs.value }}
            ghcr.io/${{ github.repository_owner }}/humanwareos-buzz:r2-alpha
          cache-from: type=gha
          cache-to: type=gha,mode=max
